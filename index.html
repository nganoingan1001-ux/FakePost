  b.append(n,t,r);b.onclick=()=>cmMenu(p,i,j);
  const k=(x.n||0)+(x.liked?1:0),h=el('button','hh'+(x.liked?' lkd':''));h.innerHTML=ic('heart')+(k?'<span>'+k+'</span>':'');
  h.onclick=e=>{e.stopPropagation();x.liked=!x.liked;save();drawCL()};
  d.append(w,b,h);return d;
}
function drawCL(){
  const p=PO(CS.pid);if(!p){CS=null;$('#cs').classList.remove('on');return}
  const L=$('#cl'),st=L.scrollTop;L.replaceChildren();
  $('#csi').style.backgroundImage=p.img?'url('+p.img+')':'none';
  (p.cm||[]).forEach((x,i)=>{L.append(cmEl(p,x,i,null));(x.r||[]).forEach((y,j)=>L.append(cmEl(p,y,i,j)))});
  L.scrollTop=st;$('#cav').replaceChildren(av(P(S.me)));
}
function cmMenu(p,i,j){
  const x=j==null?p.cm[i]:p.cm[i].r[j];
  menu([['Đổi người bình luận',()=>menu(S.chars.map(c=>[c.name,()=>{x.c=c.id}]))],
   ['Đổi thời gian hiển thị',()=>{const t=prompt('Thời gian hiển thị (vd: 1 tuần):',x.tm||'');if(t!=null)x.tm=t.trim()}],
   ['Đổi số lượt thích',()=>{const n=prompt('Số lượt thích:',x.n||0);if(n!=null)x.n=Math.max(0,+n||0)}],
   ['Xóa bình luận',()=>{if(j==null)p.cm.splice(i,1);else p.cm[i].r.splice(j,1)},1]]);
}
function upRB(){const r=$('#rb');r.style.display=CS&&CS.rp?'flex':'none';if(CS&&CS.rp)$('#rbt').textContent='Đang trả lời '+CS.rp.name}
function tg(){const on=!!$('#ci').value.trim();$('#cp').style.display=on?'block':'none';$('#cic').style.display=on?'none':'flex'}
function sendCm(){
  const v=$('#ci').value.trim();if(!v||!CS)return;const p=PO(CS.pid);p.cm=p.cm||[];
  const o={id:uid(),c:S.me,t:v,tm:'Vừa xong'};
  if(CS.rp&&p.cm[CS.rp.i]){const q=p.cm[CS.rp.i];(q.r=q.r||[]).push(o)}else{o.r=[];p.cm.push(o)}
  CS.rp=null;$('#ci').value='';tg();upRB();save();drawCL();const L=$('#cl');L.scrollTop=L.scrollHeight;
}
function vChat(w){
  const c=P(w.id),cv=cvo(c.id),v=$('#v');
  if(CID!==w.id){CID=w.id;CW='me';camUp()}
  document.body.dataset.th=cv.th||'';
  const u=el('div','cu'),go1=()=>go({t:'prof',id:c.id});u.append(el('b','',c.dn||c.name),el('span','',c.name));u.onclick=go1;
  const a=rav(c,40);a.onclick=go1;
  hd([btn('back',back),a,u],null,[btn('phone',()=>chatTools(c.id)),btn('video')]);
  cv.m.forEach((x,i)=>{
    const pv=cv.m[i-1],nx=cv.m[i+1],me=x.c===S.me,last=!nx||nx.c!==x.c||nx.t-x.t>36e5;
    if(!pv||x.t-pv.t>36e5)v.append(el('div','ts',tsFmt(x.t)));
    const row=(node,showAv)=>{const r=el('div','mg '+(me?'me':'th'));if(!me)r.append(showAv?rav(P(x.c),28):el('span','sp28'));r.append(node);node.onclick=()=>msgMenu(c.id,x);v.append(r)};
    if(x.k==='sr'){v.append(el('div','sl'+(me?' r':''),me?'Bạn đã trả lời tin của họ':'Đã trả lời tin của bạn'));const k=el('div','sc');k.style.backgroundImage='url('+x.src+')';row(k,!x.m&&last);if(x.m)row(el('div','bb',x.m),last)}
    else if(x.k==='img'){const d=el('div','mi'),im=new Image();im.src=x.src;d.append(im);row(d,last)}
    else if(x.k==='st'){const im=new Image();im.src=x.src;im.className='stk';row(im,last)}
    else row(el('div','bb',x.m),last);
  });
  const l=cv.m[cv.m.length-1];if(l&&l.c===S.me&&cv.seen)v.append(el('div','sn',cv.seen));
}
function msgMenu(id,x){
  const cv=cvo(id);
  menu([['Đổi người gửi',()=>{x.c=x.c===S.me?id:S.me}],
   ['Đổi thời gian',()=>{const d=el('input');d.type='datetime-local';d.value=new Date(x.t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
     modal('Đổi thời gian tin nhắn',[d],'Lưu',()=>{const t=new Date(d.value).getTime();if(!t)return false;x.t=t;cv.m.sort((a,b)=>a.t-b.t);save();draw(1)})}],
   ['Xóa tin nhắn',()=>{cv.m=cv.m.filter(z=>z!==x);S.dmc[kk(S.me,id)]=cv},1]]);
}
function chatTools(id){
  const cv=cvo(id),c=P(id);
  menu([['Chủ đề: Mặc định (tím)',()=>{cv.th=''}],['Chủ đề: Hồng',()=>{cv.th='pink'}],
   ['Sửa dòng "Đã xem" dưới tin cuối',()=>{const t=prompt('Nội dung (để trống để ẩn):',cv.seen||'Đã xem tuần trước');if(t!=null)cv.seen=t.trim()}],
   ['Sửa dòng hiển thị ở danh sách tin nhắn',()=>dmForm(c)],
   ['Xóa toàn bộ tin nhắn',()=>{if(confirm('Xóa toàn bộ tin nhắn?'))cv.m=[]},1]]);
}
function pushM(o){const cv=cvo(CID),l=cv.m[cv.m.length-1];o.c=CW==='o'?CID:S.me;o.t=Math.max(Date.now(),l?l.t+1000:0);cv.m.push(o);save()}
function camUp(){const b=$('#cam');b.replaceChildren();if(CW==='o'&&CID){const a=av(P(CID));a.style.cssText='width:100%;height:100%';b.append(a)}else b.innerHTML=ic('cam')}
function cparts(){
  const out=[];let buf='';
  const fl=()=>{const t=buf.replace(/\u00a0/g,' ').trim();if(t)out.push({t:'t',v:t});buf=''};
  const walk=n=>n.childNodes.forEach(k=>{if(k.nodeType===3)buf+=k.nodeValue;else if(k.nodeName==='BR')buf+='\n';else if(k.nodeName==='IMG'){fl();out.push({t:'i',src:k.src})}else{if(buf&&!buf.endsWith('\n'))buf+='\n';walk(k)}});
  walk($('#cin'));fl();return out;
}
function ctg(){const I=$('#cin');if(!I.textContent&&!I.querySelector('img'))I.innerHTML='';const on=!!(I.textContent.trim()||I.querySelector('img'));$('#cgo').style.display=on?'block':'none';$('#cics').style.display=on?'none':'flex'}
async function csend(){
  const ps=cparts();if(!ps.length||!CID)return;$('#cin').innerHTML='';ctg();
  for(const p of ps){if(p.t==='t')pushM({k:'t',m:p.v});else try{const u=await small(await(await fetch(p.src)).blob(),240);if(u)pushM({k:'st',src:u})}catch(e){}}
  draw(1);
}
function storyForm(id){
  const c=P(id);let img;const ib=el('button','pk','Chọn ảnh cho tin');ib.onclick=()=>pick(async f=>{const u=await small(f,1080);if(u){img=u;ib.textContent='Đã chọn ảnh ✓'}else alert('Không đọc được ảnh này.')});
  const tx=inp('Chữ trên tin (không bắt buộc)',''),tm=inp('Ví dụ: 2 giờ','1 giờ');
  modal('Đăng tin · '+c.name,[ib,tx,lab('Thời gian hiển thị',tm)],'Đăng',()=>{if(!img){alert('Hãy chọn ảnh.');return false}(c.st=c.st||[]).push({id:uid(),img,tx:tx.value.trim(),tm:tm.value.trim()});save();draw(1)});
}
function openSV(id,i){SV={id,i:i||0};$('#sv').classList.add('on');drawSV()}
function closeSV(){SV=null;$('#sv').classList.remove('on');draw(1)}
function svSend(t){
  const s=P(SV.id).st[SV.i],cv=cvo(SV.id),l=cv.m[cv.m.length-1];
  cv.m.push({k:'sr',c:S.me,src:s.img,m:t,t:Math.max(Date.now(),l?l.t+1000:0)});save();note('Đã gửi');
}
function drawSV(){
  const c=P(SV.id),st=c.st||[],s=st[SV.i];if(!s)return closeSV();
  const own=c.id===S.me;
  $('#svi').style.backgroundImage='url('+s.img+')';$('#svt').textContent=s.tx||'';
  $('#svp').replaceChildren(...st.map((_,k)=>el('i',k<=SV.i?'f':'')));
  const h=$('#svh'),a=av(c);a.style.cssText='width:36px;height:36px;flex:none';
  const nm=el('b','',c.name),tm=el('span','sub',s.tm||''),sp=el('div');sp.style.flex='1';
  const mo=btn('dots',()=>menu([['Sửa thời gian hiển thị',()=>{const t=prompt('Thời gian (vd: 2 giờ):',s.tm||'');if(t!=null)s.tm=t.trim()}],['Xóa tin này',()=>{st.splice(SV.i,1);if(!st.length)closeSV();else SV.i=Math.min(SV.i,st.length-1)},1]]));
  mo.querySelector('g').style.fill='#fff';
  h.replaceChildren(a,nm,tm,sp,mo,btn('close',closeSV));
  const b=$('#svb');b.replaceChildren();
  if(own){const l=el('div','','Hoạt động');l.style.flex='1';b.append(l,btn('dm'))}
  else{const p=el('div','svp'),i=el('input');i.id='svin';i.placeholder='Gửi tin nhắn...';i.autocomplete='off';p.append(i);
    const go2=()=>{if(i.value.trim()){svSend(i.value.trim());i.value=''}};
    i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go2()}};
    b.append(p,btn('heart',()=>svSend('❤️')),btn('dm',go2))}
}
function shot(on){document.body.classList.toggle('shot',on);note(on?'Đã bật chế độ chụp ảnh. Đợi 4 giây rồi chụp. Chạm 3 lần vào màn hình để thoát.':'Đã thoát chế độ chụp ảnh',on?4000:1500)}
let taps=[];
document.addEventListener('pointerup',()=>{if(!document.body.classList.contains('shot'))return;const n=Date.now();taps=taps.filter(t=>n-t<800);taps.push(n);if(taps.length>=3){taps=[];shot(false)}});
function exportJSON(){
  const d=JSON.stringify(S);
  const manual=()=>{const ta=el('textarea');ta.value=d;ta.readOnly=true;modal('Dữ liệu JSON',[el('div','hint','Không tự sao chép được. Chạm vào ô, chọn tất cả rồi sao chép.'),ta],'Xong',()=>{});setTimeout(()=>{ta.focus();ta.select()},50)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(d).then(()=>note('Đã sao chép dữ liệu JSON ('+Math.ceil(d.length/1024)+' KB)'),manual);else manual();
}
function importJSON(){
  const ta=el('textarea');ta.placeholder='Dán dữ liệu JSON vào đây';
  modal('Nhập dữ liệu JSON',[el('div','hint','Dữ liệu hiện tại sẽ bị thay thế.'),ta],'Nhập',()=>{
    let o;try{o=JSON.parse(ta.value);if(!o||!Array.isArray(o.chars)||!o.chars.length||!Array.isArray(o.posts))throw 0}catch(e){alert('JSON không hợp lệ.');return false}
    const im=v=>typeof v==='string'&&v.startsWith('data:image/');
    o.chars=o.chars.map((c,i)=>{const n=Object.assign(mk(String(c.id||uid()),String(c.name||'?'),String(c.dn||'')),c);n.id=String(n.id);if(!im(n.av))delete n.av;n.hl=(Array.isArray(n.hl)?n.hl:[]).map(h=>({n:String(h.n||''),img:im(h.img)?h.img:undefined}));n.dm=Object.assign({t:'',tm:'',u:0,p:0},n.dm);return n});
    o.posts=o.posts.filter(p=>p&&typeof p==='object').map(p=>{if(!im(p.img))delete p.img;p.id=String(p.id||uid());p.cm=Array.isArray(p.cm)?p.cm:[];return p});
    if(!confirm('Thay thế toàn bộ dữ liệu hiện tại?'))return false;
    o.chars.forEach(c=>{c.st=(Array.isArray(c.st)?c.st:[]).filter(s=>im(s.img))});const dmc=o.dmc&&typeof o.dmc==='object'?o.dmc:{};Object.values(dmc).forEach(v=>{v.m=(Array.isArray(v.m)?v.m:[]).filter(m=>m&&((m.k!=='img'&&m.k!=='st'&&m.k!=='sr')||im(m.src)))});
    S={me:o.chars.some(c=>c.id===o.me)?o.me:o.chars[0].id,chars:o.chars,posts:o.posts,fol:o.fol&&typeof o.fol==='object'?o.fol:{},dmc};H=[{t:'home'}];save();draw();note('Đã nhập dữ liệu');
  });
}
(function(){
  const N=$('#nav');
  [['home','home'],['reels','reels'],['dm','dm'],['search','search']].forEach(([t,i])=>{const b=btn(i,()=>{if(t==='home'||t==='dm')go({t},1);else note('Không có trong bản mô phỏng')});b.dataset.t=t;N.append(b)});
  const b=el('button');b.dataset.t='prof';b.innerHTML='<span id="navav" style="display:block;width:28px;height:28px"></span>';b.onclick=()=>go({t:'prof',id:S.me},1);N.append(b);
  $('#csp').innerHTML=ic('dm');$('#cic').innerHTML=ic('img')+ic('gif');
  ['❤️','🙌','🔥','👏','😢','😍','😮','😂'].forEach(e=>{const x=el('button','',e);x.onclick=()=>{$('#ci').value+=e;tg();$('#ci').focus()};$('#em').append(x)});
  $('#ci').oninput=tg;$('#ci').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendCm()}};
  $('#cp').onclick=sendCm;$('#csi').onclick=closeCS;
  $('#rbx').onclick=()=>{CS.rp=null;$('#ci').value='';tg();upRB()};
  $('#modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};
})();
(function(){
  const I=$('#cin');
  $('#cmic').innerHTML=ic('mic');$('#cim').innerHTML=ic('img');$('#cst').innerHTML=ic('stk');$('#cpl').innerHTML=ic('plus');camUp();
  I.oninput=ctg;I.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();csend()}};
  I.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;e.preventDefault();const fs=[...cd.files].filter(f=>f.type.startsWith('image/'));
    if(fs.length&&CID){fs.forEach(async f=>{const u=await small(f,240);if(u){pushM({k:'st',src:u});draw(1)}});return}
    document.execCommand('insertText',false,cd.getData('text/plain'));ctg()});
  $('#cgo').onclick=csend;
  $('#cam').onclick=()=>{CW=CW==='me'?'o':'me';camUp()};
  $('#cim').onclick=()=>pick(async f=>{const u=await small(f,900);if(u&&CID){pushM({k:'img',src:u});draw(1)}});
  $('#cst').onclick=()=>pick(async f=>{const u=await small(f,240);if(u&&CID){pushM({k:'st',src:u});draw(1)}});
  $('#svl').onclick=()=>{if(SV&&SV.i>0){SV.i--;drawSV()}};
  $('#svr').onclick=()=>{if(!SV)return;if(SV.i<P(SV.id).st.length-1){SV.i++;drawSV()}else closeSV()};
})();
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
